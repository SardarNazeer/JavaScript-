    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: bisque;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        #main {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 150px;
        }

        #task2 {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* input{

        .btn {
            background-color: rgb(4, 73, 4);
            padding: 12px 22px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 5px;
            color: #fff;
        }

        .btn:hover {
            background-color: rgb(9, 160, 9);
        }

        #formSub {
            /* height: 100vh; */
            display: block;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 150px;
            margin: 20px;
        }

        form input {
            padding: 10px;
            border-radius: 6px;
            border: none;
        }

        form input:focus {
            outline: none;
        }

        .card{
            margin-top: 20px;
            border: 2px solid red;
            width: 300px;
            margin-left: 40px;
            padding: 12px 22px;
        }
        .card .profile{
            border-radius: 50%;
            width: 50px;

        }

        .card .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            overflow: hidden;
            border-radius: 50%;
        }

        .card h1{
            font-size: 20px;
        }
    </style>
</head>
