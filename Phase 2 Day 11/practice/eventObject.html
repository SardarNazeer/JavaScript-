<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .main{
        background-color:bisque;
        color: white;
        height: 40px;
    }
    .nav{
        display: flex;
        justify-content: space-around;
        padding-top: 10px;
    }
    .main .nav a{
        text-decoration: none;
        color: black;
    }
    .nav button{
        background-color: brown;
        color: #fff;
        border-radius: 5px;
        padding: 4px;
        border: none;
    }

    .li{
        text-decoration: line-through;
    }

    .a{
        width: 80%;
        height: 60vh;
        background-color: aqua;
    }
        .b{
        width: 80%;
        height: 50vh;
        background-color: brown;
    }
        .c{
        width: 80%;
        height: 40vh;
        background-color:blue;
    }
    .a .b .c button{
        background-color: bisque;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        margin: 40px;
    }
</style>

<body>
    
    <!-- <button>Click me</button> -->

    <div class="main">
        <div class="nav">
            <a href="">Home</a>
            <a href="">About</a>
            <button>Click & Follow</button>
        </div>
    </div>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Watermelon</li>
        <li>guava</li>
    </ul>

    <div class="a">
        <div class="b">
            <div class="c">
                <button>Click me</button>
            </div>
        </div>
    </div>

    <script src="eventObject.js"></script>
</body>
</html>
