<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <header class="header">
            <h1>Notes App</h1>
            <p>Sava your thoughts and ideas in style</p>
        </header>

        <div class="controls">
            <div class="controls-container">
                <input type="text" id="searchInput" placeholder="search notes..">

                <div class="filter-groups">
                    <select id="filterSelect">
                        <option value="all">All Notes</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="ideas">Ideas</option>
                        <option value="remainder">Remainder</option>
                    </select>

                    <button id="addNoteBtn"><i class="fas fa-plus"></i>Add</button>
                </div>
            </div>
        </div>

        <div id="notesContainer">
            <!-- notes yaha js se dynamically add kiye jayenge -->
        </div>

        <div id="emptyState">
            <i class="fas fa-notes-medical"></i>
            <h3>No Notes</h3>
            <p>Add your first notes by clicking "Add" button</p>
        </div>


        <div id="addNoteModel">
            <div class="modal">
                <div class="modal-header">
                    <h3 class="modal-title">New Note</h3>
                    <button id="closeModalBtn"><i class="fas fa-times"></i></button>
                </div>

                <form action="" id="noteForm">
                    <div class="form-group">
                        <label for="noteTitle" class="form-label">Title</label>
                        <input type="text" required id="noteTitle">
                    </div>
                    <div class="form-group">
                        <label for="noteContent" class="form-label">Content</label>
                        <textarea id="noteContent" class="form-input form-textarea"
                        required></textarea>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
