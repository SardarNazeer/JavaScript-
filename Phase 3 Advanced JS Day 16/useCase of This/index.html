<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Cards UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* FORM */

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #222;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .form-group textarea {
            resize: none;
            height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #1749b9;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card-content h3 {
            margin-bottom: 8px;
            color: #222;
        }

        .role {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .bio {
            color: #555;
            line-height: 1.5;
        }
        .btn{
            background-color: #222;
            color: #f4f7fb;
            padding: 12px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- FORM -->

        <form class="form-box">
            <h2>Add User</h2>

            <div class="form-group">
                <input type="text" id="name" placeholder="Enter Name"><br>
                <input type="text" id="role" placeholder="Enter Role"><br>
                <textarea id="bio" placeholder="Enter Bio"></textarea><br>
                <input id="photo" type="text" placeholder="Enter Photo URL">

            </div>


            <button class="submit-btn">Submit</button>
        </form>

        <!-- USER CARDS -->

        <div class="cards">

           
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
